[project]
name = "smolagents-workspace-demo"
version = "0.1.0"
description = "基于 smolagents 的最小化本地工作区 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0,<2",
  "smolagents[openai]==1.26.0",
]

[project.scripts]
agent-demo = "agent_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_demo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
